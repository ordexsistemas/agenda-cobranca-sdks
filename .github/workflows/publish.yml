name: Publish SDKs

on:
  push:
    tags:
      - "sdk/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão SemVer sem prefixo (ex: 0.2.0). Vazio = tag atual ou VERSION.yml"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    name: Resolver versão
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolver
        id: out
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VER="${INPUT_VERSION:-}"
          if [ -z "$VER" ] && [[ "${GITHUB_REF:-}" == refs/tags/sdk/v* ]]; then
            VER="${GITHUB_REF_NAME#sdk/v}"
          fi
          if [ -z "$VER" ]; then
            VER=$(python3 -c "from pathlib import Path; import sys; sys.path.insert(0,'.'); from tools.versionamento.files import load_version_yml; print(load_version_yml(Path('VERSION.yml'))[1])")
          fi
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida: $VER" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Publicando SDKs v$VER no GitHub Packages"

  npm:
    name: GitHub Packages npm (@ordexsistemas/agenda-cobranca)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: sdk/v${{ needs.resolve.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@ordexsistemas"

      - name: Publish
        working-directory: packages/nodejs/agenda-cobranca
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN ausente; impossível publicar no GitHub Packages"
            exit 1
          fi
          npm ci
          npm test
          npm run build
          CURRENT=$(npm view @ordexsistemas/agenda-cobranca version --registry=https://npm.pkg.github.com 2>/dev/null || true)
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "@ordexsistemas/agenda-cobranca@$VERSION já publicado no GitHub Packages"
            exit 0
          fi
          npm publish

  npm-whatsapp:
    name: GitHub Packages npm (@ordexsistemas/whatsapp-sdk)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: sdk/v${{ needs.resolve.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@ordexsistemas"

      - name: Publish
        working-directory: packages/nodejs/whatsapp-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN ausente; impossível publicar no GitHub Packages"
            exit 1
          fi
          npm ci
          npm test
          npm run build
          CURRENT=$(npm view @ordexsistemas/whatsapp-sdk version --registry=https://npm.pkg.github.com 2>/dev/null || true)
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "@ordexsistemas/whatsapp-sdk@$VERSION já publicado no GitHub Packages"
            exit 0
          fi
          npm publish

  rubygems:
    name: GitHub Packages RubyGems (agenda_cobranca)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: sdk/v${{ needs.resolve.outputs.version }}
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: packages/ruby/agenda_cobranca

      - name: Publish
        working-directory: packages/ruby/agenda_cobranca
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN ausente; impossível publicar no GitHub Packages"
            exit 1
          fi
          mkdir -p "$HOME/.gem"
          printf '%s\n' ":github: Bearer ${GITHUB_TOKEN}" > "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"
          gem build agenda_cobranca.gemspec
          gem push --key github --host https://rubygems.pkg.github.com/ordexsistemas \
            "agenda_cobranca-${VERSION}.gem"

  rubygems-whatsapp:
    name: GitHub Packages RubyGems (ordex_whatsapp)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: sdk/v${{ needs.resolve.outputs.version }}
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: packages/ruby/whatsapp

      - name: Publish
        working-directory: packages/ruby/whatsapp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN ausente; impossível publicar no GitHub Packages"
            exit 1
          fi
          mkdir -p "$HOME/.gem"
          printf '%s\n' ":github: Bearer ${GITHUB_TOKEN}" > "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"
          gem build ordex_whatsapp.gemspec
          gem push --key github --host https://rubygems.pkg.github.com/ordexsistemas \
            "ordex_whatsapp-${VERSION}.gem"

  nuget:
    name: GitHub Packages NuGet (AgendaCobranca.Sdk)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: sdk/v${{ needs.resolve.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        working-directory: packages/csharp/AgendaCobranca.Sdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN ausente; impossível publicar no GitHub Packages"
            exit 1
          fi
          SOURCE="https://nuget.pkg.github.com/ordexsistemas/index.json"
          dotnet nuget add source "$SOURCE" \
            --name github \
            --username "${{ github.actor }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text
          dotnet pack src/AgendaCobranca.Sdk/AgendaCobranca.Sdk.csproj \
            -c Release \
            --output nupkgs \
            -p:PackageVersion="$VERSION"
          dotnet nuget push nupkgs/*.nupkg \
            --api-key "$GITHUB_TOKEN" \
            --source github \
            --skip-duplicate

  nuget-whatsapp:
    name: GitHub Packages NuGet (Ordex.WhatsApp.Sdk)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: sdk/v${{ needs.resolve.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        working-directory: packages/csharp/Ordex.WhatsApp.Sdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN ausente; impossível publicar no GitHub Packages"
            exit 1
          fi
          SOURCE="https://nuget.pkg.github.com/ordexsistemas/index.json"
          dotnet nuget add source "$SOURCE" \
            --name github \
            --username "${{ github.actor }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text
          dotnet pack src/Ordex.WhatsApp.Sdk/Ordex.WhatsApp.Sdk.csproj \
            -c Release \
            --output nupkgs \
            -p:PackageVersion="$VERSION"
          dotnet nuget push nupkgs/*.nupkg \
            --api-key "$GITHUB_TOKEN" \
            --source github \
            --skip-duplicate

  go:
    name: Go module (tag de subdiretório)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: sdk/v${{ needs.resolve.outputs.version }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test + tag de módulo + proxy
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tag_go_module() {
            local dir="$1"
            local expected="$2"
            cd "$GITHUB_WORKSPACE/$dir"
            go test ./...
            MODULE=$(grep '^module ' go.mod | awk '{print $2}')
            echo "module=$MODULE ($dir)"
            if [ "$MODULE" != "$expected" ]; then
              echo "::warning::module path inesperado em $dir: $MODULE (esperado $expected)"
            fi
            cd "$GITHUB_WORKSPACE"
            GO_TAG="${dir}/v${VERSION}"
            if git rev-parse "$GO_TAG" >/dev/null 2>&1; then
              echo "Tag $GO_TAG já existe"
            else
              git tag -a "$GO_TAG" -m "Go module ${MODULE} v${VERSION}"
              git push origin "$GO_TAG"
              echo "Criada tag $GO_TAG"
            fi
            curl -fsS "https://proxy.golang.org/${MODULE}/@v/v${VERSION}.info" \
              && echo "proxy.golang.org indexou ${MODULE}@v${VERSION}" \
              || echo "::warning::proxy.golang.org ainda não resolve ${MODULE}@v${VERSION} (vanity DNS ou tag). Ver README (GitHub Packages)."
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tag_go_module "packages/go/agenda-cobranca-go" "agendacobranca.dev/sdk/go"
          tag_go_module "packages/go/whatsapp-go" "agendacobranca.dev/sdk/whatsapp"
